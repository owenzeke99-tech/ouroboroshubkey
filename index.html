<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ouroboros Hub Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --pink:#f3a9c8;
    --pink2:#ffd9e8;
    --pink3:#e987b0;
    --gray:#92929b;
    --dark:#0b0b0f;
    --dark2:#17171d;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'Poppins',sans-serif;
    color:white;

    background:
        radial-gradient(circle at 50% 30%,
            rgba(243,169,200,.18),
            transparent 28%),
        radial-gradient(circle at 10% 90%,
            rgba(255,217,232,.09),
            transparent 25%),
        radial-gradient(circle at 90% 10%,
            rgba(146,146,155,.10),
            transparent 25%),
        linear-gradient(
            135deg,
            #09090c,
            #19191f 50%,
            #08080b
        );
}

/* GRID */

body::before{
    content:"";
    position:absolute;
    inset:-100px;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    transform:perspective(500px) rotateX(60deg)
              translateY(100px);

    animation:gridMove 15s linear infinite;
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:0 450px;
    }
}

/* LIGHT BLOBS */

.glow{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;

    background:rgba(243,169,200,.08);

    filter:blur(60px);

    animation:blobFloat 9s ease-in-out infinite;
}

.glow.one{
    left:-160px;
    top:-120px;
}

.glow.two{
    right:-160px;
    bottom:-130px;
    animation-delay:-4s;
}

@keyframes blobFloat{
    0%,100%{
        transform:translate(0,0) scale(1);
    }
    50%{
        transform:translate(35px,-25px) scale(1.15);
    }
}

/* PARTICLES */

.particle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;

    background:var(--pink2);

    box-shadow:
        0 0 8px var(--pink),
        0 0 18px var(--pink);

    animation:particleFloat linear infinite;
}

.p1{left:8%;top:80%;animation-duration:8s;}
.p2{left:16%;top:30%;animation-duration:11s;}
.p3{left:25%;top:90%;animation-duration:9s;}
.p4{left:35%;top:20%;animation-duration:13s;}
.p5{left:47%;top:75%;animation-duration:10s;}
.p6{left:58%;top:15%;animation-duration:12s;}
.p7{left:69%;top:85%;animation-duration:9s;}
.p8{left:78%;top:35%;animation-duration:14s;}
.p9{left:88%;top:70%;animation-duration:10s;}
.p10{left:94%;top:20%;animation-duration:12s;}

@keyframes particleFloat{
    0%{
        transform:translateY(40px) scale(.3);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    75%{
        opacity:.7;
    }

    100%{
        transform:translateY(-300px) scale(1.5);
        opacity:0;
    }
}

/* CARD */

.card{
    width:min(92%,520px);
    position:relative;
    z-index:10;

    padding:45px 34px 36px;

    text-align:center;

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.7),
        0 0 80px rgba(243,169,200,.07),
        inset 0 1px 0 rgba(255,255,255,.12);

    animation:cardAppear 1s cubic-bezier(.2,.8,.2,1);
}

.card::before{
    content:"";
    position:absolute;
    inset:-1px;

    border-radius:32px;

    background:
        linear-gradient(
            120deg,
            transparent 15%,
            rgba(243,169,200,.8),
            transparent 35%,
            transparent 65%,
            rgba(255,217,232,.5),
            transparent 85%
        );

    background-size:250% 100%;

    animation:borderSweep 5s linear infinite;

    z-index:-1;
    opacity:.55;
}

@keyframes borderSweep{
    0%{
        background-position:200% 0;
    }

    100%{
        background-position:-50% 0;
    }
}

@keyframes cardAppear{
    from{
        opacity:0;
        transform:translateY(40px) scale(.9);
        filter:blur(10px);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

/* LOGO */

.logo-area{
    width:135px;
    height:135px;

    margin:0 auto 22px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
}

.ring{
    position:absolute;
    border-radius:50%;
}

.ring.one{
    width:135px;
    height:135px;

    border:1px solid rgba(243,169,200,.4);

    border-left-color:transparent;
    border-right-color:transparent;

    animation:spin 7s linear infinite;
}

.ring.two{
    width:112px;
    height:112px;

    border:1px dashed rgba(255,217,232,.4);

    animation:spinReverse 10s linear infinite;
}

.ring.three{
    width:92px;
    height:92px;

    border:2px solid rgba(243,169,200,.12);

    box-shadow:
        0 0 20px rgba(243,169,200,.15);

    animation:ringPulse 2.5s ease-in-out infinite;
}

.logo{
    width:78px;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:23px;

    font-family:'Orbitron',sans-serif;
    font-size:48px;
    font-weight:800;

    color:white;

    background:
        linear-gradient(
            145deg,
            #ffd9e8,
            #f0a8c6 48%,
            #85858e
        );

    border:2px solid rgba(255,255,255,.55);

    box-shadow:
        0 0 20px rgba(243,169,200,.6),
        0 0 60px rgba(243,169,200,.2),
        inset 0 0 20px rgba(255,255,255,.22);

    text-shadow:
        0 0 12px white,
        0 0 25px var(--pink);

    animation:logoFloat 3s ease-in-out infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

@keyframes spinReverse{
    to{transform:rotate(-360deg);}
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(.95);
        opacity:.5;
    }

    50%{
        transform:scale(1.1);
        opacity:1;
    }
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-5px) scale(1.05);
    }
}

/* TITLE */

.title{
    font-family:'Orbitron',sans-serif;
    font-size:32px;
    font-weight:800;
    letter-spacing:1.5px;

    background:
        linear-gradient(
            90deg,
            white,
            var(--pink2),
            white,
            var(--pink)
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:titleGradient 5s linear infinite;
}

@keyframes titleGradient{
    to{
        background-position:300% center;
    }
}

.subtitle{
    margin-top:9px;

    color:#aaaab3;

    font-size:13px;
    letter-spacing:1px;
}

/* DECORATION */

.decor{
    display:flex;
    align-items:center;
    gap:10px;

    margin:25px 0 22px;

    opacity:.55;
}

.decor span{
    height:1px;
    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--pink),
            transparent
        );
}

.decor i{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--pink2);

    box-shadow:
        0 0 8px var(--pink),
        0 0 18px var(--pink);

    animation:dotPulse 1.5s ease-in-out infinite;
}

@keyframes dotPulse{
    50%{
        transform:scale(1.8);
        box-shadow:
            0 0 15px var(--pink),
            0 0 30px var(--pink);
    }
}

/* KEY BOX */

.key-wrapper{
    position:relative;

    padding:2px;

    border-radius:20px;

    background:
        linear-gradient(
            110deg,
            #55555d,
            #f3a9c8,
            #ffd9e8,
            #85858d,
            #f3a9c8,
            #55555d
        );

    background-size:400% 100%;

    animation:keyBorder 5s linear infinite;

    box-shadow:
        0 0 25px rgba(243,169,200,.12);
}

@keyframes keyBorder{
    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

.key-box{
    position:relative;

    display:flex;
    align-items:center;

    gap:8px;

    min-height:68px;

    padding:7px 7px 7px 18px;

    border-radius:18px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(18,18,23,.98),
            rgba(31,31,38,.96)
        );
}

/* SCANNING LIGHT */

.key-box::before{
    content:"";

    position:absolute;

    top:0;
    left:-80px;

    width:55px;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,217,232,.28),
            transparent
        );

    transform:skewX(-20deg);

    animation:keyScan 3.5s ease-in-out infinite;
}

@keyframes keyScan{
    0%{
        left:-80px;
    }

    55%,100%{
        left:calc(100% + 80px);
    }
}

/* KEY ICON */

.key-icon{
    width:36px;
    height:36px;

    flex-shrink:0;

    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            rgba(243,169,200,.22),
            rgba(255,255,255,.05)
        );

    border:1px solid rgba(243,169,200,.2);

    color:var(--pink2);

    font-size:17px;

    box-shadow:
        inset 0 0 12px rgba(243,169,200,.05),
        0 0 15px rgba(243,169,200,.08);

    animation:keyIconPulse 2s ease-in-out infinite;
}

@keyframes keyIconPulse{
    50%{
        box-shadow:
            inset 0 0 15px rgba(243,169,200,.1),
            0 0 22px rgba(243,169,200,.2);
    }
}

input{
    flex:1;
    min-width:0;

    height:48px;

    border:none;
    outline:none;

    background:transparent;

    color:#f4f4f5;

    font-family:'Poppins',sans-serif;
    font-size:12px;
    font-weight:500;

    letter-spacing:.15px;

    text-overflow:ellipsis;
}

input::selection{
    background:rgba(243,169,200,.35);
}

/* COPY BUTTON */

.copy-btn{
    position:relative;

    flex-shrink:0;

    height:50px;

    padding:0 20px;

    border:none;
    border-radius:13px;

    cursor:pointer;

    overflow:hidden;

    color:#242027;

    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:13px;

    background:
        linear-gradient(
            135deg,
            #ffe2ed,
            #f3abc9
        );

    box-shadow:
        0 7px 20px rgba(243,169,200,.2);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
}

.copy-btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.6),
            transparent
        );

    transform:skewX(-20deg);

    transition:.5s;
}

.copy-btn:hover::before{
    left:140%;
}

.copy-btn:hover{
    transform:translateY(-3px);

    filter:brightness(1.08);

    box-shadow:
        0 10px 30px rgba(243,169,200,.38),
        0 0 25px rgba(243,169,200,.18);
}

.copy-btn:active{
    transform:scale(.94);
}

/* STATUS */

.status{
    min-height:22px;

    margin-top:16px;

    color:#cfcfd5;

    font-size:12px;

    transition:.3s;
}

.status.success{
    color:var(--pink2);

    text-shadow:
        0 0 12px rgba(243,169,200,.5);
}

/* BOTTOM DECORATION */

.bottom-line{
    margin-top:25px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;

    color:#777780;

    font-size:10px;

    letter-spacing:2px;
}

.bottom-line b{
    width:5px;
    height:5px;

    border-radius:50%;

    background:var(--pink);

    box-shadow:
        0 0 10px var(--pink);

    animation:bottomDot 1.8s infinite;
}

@keyframes bottomDot{
    50%{
        transform:scale(1.8);
        opacity:.5;
    }
}

/* MOBILE */

@media(max-width:550px){

    .card{
        width:92%;
        padding:38px 18px 30px;
        border-radius:27px;
    }

    .title{
        font-size:25px;
        letter-spacing:1px;
    }

    .subtitle{
        font-size:12px;
    }

    .logo-area{
        transform:scale(.9);
        margin-bottom:13px;
    }

    .key-box{
        min-height:125px;
        flex-wrap:wrap;
        justify-content:center;
        padding:8px;
    }

    .key-icon{
        display:none;
    }

    input{
        width:100%;
        flex-basis:100%;
        text-align:center;
        height:45px;
    }

    .copy-btn{
        width:100%;
        height:48px;
    }
}

@media(max-height:700px){

    .card{
        transform:scale(.88);
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>
<div class="particle p7"></div>
<div class="particle p8"></div>
<div class="particle p9"></div>
<div class="particle p10"></div>

<div class="card">

    <div class="logo-area">

        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>

        <div class="logo">O</div>

    </div>

    <h1 class="title">
        Ouroboros Hub Key
    </h1>

    <p class="subtitle">
        Your access key is ready
    </p>

    <div class="decor">
        <span></span>
        <i></i>
        <span></span>
    </div>

    <!-- MODERN KEY BOX -->

    <div class="key-wrapper">

        <div class="key-box">

            <div class="key-icon">
                🔑
            </div>

            <input
                id="key"
                type="text"
                value="OuroborosHubKeyHsjskwjKalwpwoMamqoekeo"
                readonly
            >

            <button
                class="copy-btn"
                id="copyBtn"
                onclick="copyKey()"
            >
                Copy Key
            </button>

        </div>

    </div>

    <div
        class="status"
        id="status"
    ></div>

    <div class="bottom-line">
        <b></b>
        OUROBOROS HUB
        <b></b>
    </div>

</div>

<script>

function copyKey(){

    const input =
        document.getElementById("key");

    const button =
        document.getElementById("copyBtn");

    const status =
        document.getElementById("status");

    const key =
        input.value;

    navigator.clipboard.writeText(key)
    .then(() => {

        button.textContent = "Copied ✓";

        status.textContent =
            "Key copied successfully!";

        status.classList.add("success");

        setTimeout(() => {

            button.textContent = "Copy Key";

            status.textContent = "";

            status.classList.remove("success");

        },2200);

    })
    .catch(() => {

        input.select();

        document.execCommand("copy");

        button.textContent = "Copied ✓";

        status.textContent =
            "Key copied successfully!";

        status.classList.add("success");

        setTimeout(() => {

            button.textContent = "Copy Key";

            status.textContent = "";

            status.classList.remove("success");

        },2200);

    });

}

/* CARD TILT EFFECT */

const card =
    document.querySelector(".card");

document.addEventListener("mousemove",(e)=>{

    const x =
        (window.innerWidth / 2 - e.clientX) / 80;

    const y =
        (window.innerHeight / 2 - e.clientY) / 80;

    if(window.innerWidth > 700){

        card.style.transform =
            `perspective(1000px)
             rotateY(${x}deg)
             rotateX(${-y}deg)`;

    }

});

document.addEventListener("mouseleave",()=>{

    card.style.transform =
        "perspective(1000px) rotateY(0) rotateX(0)";

});

</script>

</body>
</html>
